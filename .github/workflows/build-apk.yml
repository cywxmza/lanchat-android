name: Build APK

# 云端编译：不用在自己电脑上装 Android Studio。
# 把本工程推到 GitHub 后，GitHub 的云端机器会自动编译，
# 在 Actions 页面下载 app-debug.apk 即可。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      # 注意：本工程的 gradlew 是精简脚本、没有 gradle-wrapper.jar，
      # 所以这里直接用系统 Gradle 编译，不用 ./gradlew。
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
